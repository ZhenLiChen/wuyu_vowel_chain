}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(

        svg.appendChild(hit);
      }

      function drawNode(svg, slot, scales, color, size, withTooltip = true, label = null) {
        const [slotName, value, xValue, yValue, , , , , isDiphthong] = slot;
        const x = scales.x(xValue);
        const y = scales.y(yValue);
        let node;
        if (isDiphthong) {
          node = svgElement(&quot;path&quot;, {
            d: `M${x},${y - size} L${x + size},${y} L${x},${y + size} L${x - size},${y} Z`,
            fill: color,
          });
        } else {
          node = svgElement(&quot;circle&quot;, { cx: x, cy: y, r: size, fill: color });
        }
        svg.appendChild(node);
        if (withTooltip) {
          const hit = svgElement(&quot;circle&quot;, { cx: x, cy: y, r: 16, class: &quot;node-hit&quot; });
          attachTooltip(hit, `${label || `${slotName} ${value}`}${isDiphthong ? &quot;（复元音，中点位置）&quot; : &quot;（单元音）&quot;}`);
          svg.appendChild(hit);
        }
      }

      function drawStopNodes(svg, stop, scales, size) {
        stop.slots.forEach((slot, index) =&gt; {
          const layerSize = size + (stop.slots.length - index - 1) * 2.5;
          drawNode(svg, slot, scales, slotColors[slot[0]], layerSize, false);
        });
        const x = scales.x(plotX(stop.slot));
        const y = scales.y(plotY(stop.slot));
        const hit = svgElement(&quot;circle&quot;, { cx: x, cy: y, r: 16, class: &quot;node-hit&quot; });
        attachTooltip(hit, stopLabel(stop));
        svg.appendChild(hit);
      }

      function drawSlotLabels(svg, stops, scales) {
        const labels = stops.map((stop) =&gt; {
          const slot = stop.slot;
          const px = plotX(slot);
          const py = plotY(slot);
          const x = scales.x(px);
          const y = scales.y(py);
          const nearRight = px &gt; 2.0;
          let preferredY = y + 4;
          if (py &lt; 0.4) preferredY = y + 18;
          if (py &gt; 2.6) preferredY = y - 9;
          return { stop, slot, x, nearRight, y: preferredY };
        });
        [true, false].forEach((nearRight) =&gt; {
          const side = labels.filter((label) =&gt; label.nearRight === nearRight).sort((a, b) =&gt; a.y - b.y);
          for (let index = 1; index &lt; side.length; index += 1) {
            side[index].y = Math.max(side[index].y, side[index - 1].y + 18);
          }
          const maxY = scales.margin.top + scales.innerHeight - 6;
          if (side.length &amp;&amp; side[side.length - 1].y &gt; maxY) {
            const shift = side[side.length - 1].y - maxY;
            side.forEach((label) =&gt; { label.y -= shift; });
          }
        });
        labels.forEach((label) =&gt; {
          appendText(svg, stopLabel(label.stop), label.x + (label.nearRight ? -9 : 9), label.y, &quot;node-label&quot;, label.nearRight ? &quot;end&quot; : &quot;start&quot;);
        });
      }

      function responsivePlot(host, draw, heightRatio = 0.76, minHeight = 220, maxHeight = 330) {
        const svg = svgElement(&quot;svg&quot;, { class: &quot;ipa-chart&quot;, role: &quot;img&quot; });
        host.replaceChildren(svg);
        const redraw = () =&gt; {
          const width = Math.max(280, host.getBoundingClientRect().width || 280);
          const height = Math.max(minHeight, Math.min(maxHeight, width * heightRatio));
          svg.setAttribute(&quot;viewBox&quot;, `0 0 ${width} ${height}`);
          svg.replaceChildren();
          draw(svg, width, height);
        };
        redraw();
        const observer = new ResizeObserver(redraw);
        observer.observe(host);
        observers.push(observer);
      }

      function renderClusters() {
        clearObservers();
        clusterGrid.replaceChildren();
        const k = String(DATA.default);
        selection.textContent = `推荐解：${k} 类｜silhouette ${DATA.scores[k].toFixed(3)}｜每类至少 ${DATA.minSize} 点`;
        DATA.solutions[k].clusters.forEach((cluster) =&gt; {
          const panel = document.createElement(&quot;section&quot;);
          panel.className = &quot;cluster-panel&quot;;
          const heading = document.createElement(&quot;div&quot;);
          heading.className = &quot;cluster-heading&quot;;
          const title = document.createElement(&quot;h3&quot;);
          title.textContent = `第 ${cluster.cluster} 类 · ${cluster.type_label} · ${cluster.size} 点`;
          const meta = document.createElement(&quot;span&quot;);
          meta.className = &quot;cluster-meta text-small&quot;;
          const medoid = pointById.get(cluster.medoid_id);
          meta.textContent = `主模式 ${collapsedChain(medoid)}｜代表方言点 ${cluster.medoid_name}`;
          const subtype = document.createElement(&quot;span&quot;);
          subtype.className = &quot;cluster-subtypes text-small&quot;;
          const patternCounts = new Map();
          cluster.members.forEach((pointId) =&gt; {
            pointById.get(pointId).slots.forEach((slot) =&gt; {
              if (!slot[8]) return;
              const key = `${slot[0]} ${slot[1]}`;
              patternCounts.set(key, (patternCounts.get(key) || 0) + 1);
            });
          });
          const patterns = [...patternCounts.entries()]
            .sort((a, b) =&gt; a[0].localeCompare(b[0], &quot;zh-CN&quot;))
            .map(([pattern, count]) =&gt; `${pattern} ×${count}`);
          subtype.textContent = `复元音顺序：${patterns.length ? patterns.join(&quot;；&quot;) : &quot;无&quot;}`;
          heading.append(title, meta, subtype);
          const host = document.createElement(&quot;div&quot;);
          host.className = &quot;plot-host&quot;;
          panel.append(heading, host);
          clusterGrid.appendChild(panel);

          responsivePlot(host, (svg, width, height) =&gt; {
            const chartTitle = svgElement(&quot;title&quot;);
            chartTitle.textContent = `第 ${cluster.cluster} 类 ${cluster.type_label}，${cluster.size} 个方言点；代表方言点 ${cluster.medoid_name}`;
            svg.appendChild(chartTitle);
            const chartDesc = svgElement(&quot;desc&quot;);
            chartDesc.textContent = &quot;实线严格按 S0、S1、S2、S3 连接类内主模式；大号彩色节点表示代表链，小号淡色节点表示类内其他方言。复元音放在两个成分的几何中点。&quot;;
            svg.appendChild(chartDesc);
            const scales = drawFrame(svg, width, height, `mlcc-c${k}-${cluster.cluster}`);
            [0, 1, 2, 3].forEach((slotIndex) =&gt; {
              const memberSlots = cluster.members.map((pointId) =&gt; pointById.get(pointId).slots[slotIndex]);
              const slotName = memberSlots[0][0];
              cluster.members.forEach((pointId) =&gt; {
                if (pointId === cluster.medoid_id) return;
                drawDeviationNode(svg, pointById.get(pointId).slots[slotIndex], scales, slotColors[slotName]);
              });
            });
            const stops = representativeStops(medoid);
            drawRepresentative(svg, medoid, stops, scales, &quot;代表方言点&quot;);
            stops.forEach((stop) =&gt; {
              drawStopNodes(svg, stop, scales, 5.5);
            });
            drawSlotLabels(svg, stops, scales);
          });
        });
      }

      function renderAlternativeSolutions() {
        solutionList.replaceChildren();
        Object.keys(DATA.solutions).sort((a, b) =&gt; Number(a) - Number(b)).forEach((k) =&gt; {
          const solution = DATA.solutions[k];
          const row = document.createElement(&quot;div&quot;);
          row.className = &quot;solution-row&quot;;
          const label = document.createElement(&quot;strong&quot;);
          label.textContent = `k=${k}${Number(k) === DATA.default ? &quot; 推荐&quot; : &quot;&quot;}`;
          const stats = document.createElement(&quot;span&quot;);
          stats.textContent = `sil. ${DATA.scores[k].toFixed(3)}｜${solution.clusters.map((cluster) =&gt; cluster.size).join(&quot;/&quot;)}`;
          const patterns = document.createElement(&quot;span&quot;);
          patterns.className = &quot;solution-patterns&quot;;
          patterns.textContent = solution.clusters
            .map((cluster) =&gt; `C${cluster.cluster} ${cluster.medoid_collapsed_chain}`)
            .join(&quot;；&quot;);
          row.append(label, stats, patterns);
          solutionList.appendChild(row);
        });
      }

      function renderPoint() {
        const point = pointById.get(pointSelect.value);
        root.querySelector(&quot;#mlcc-point-title&quot;).textContent = `逐方言点链位图 · ${point.id} ${point.name}`;
        responsivePlot(pointHost, (svg, width, height) =&gt; {
          const chartTitle = svgElement(&quot;title&quot;);
          chartTitle.textContent = `${point.id} ${point.name}：${collapsedChain(point)}`;
          svg.appendChild(chartTitle);
          const chartDesc = svgElement(&quot;desc&quot;);
          chartDesc.textContent = &quot;该方言点的 S0、S1、S2、S3 点级主体链；实线只表示 slot 顺序，不另画复元音内部轨迹。&quot;;
          svg.appendChild(chartDesc);
          const scales = drawFrame(svg, width, height, &quot;mlcc-point&quot;);
          const stops = representativeStops(point);
          drawRepresentative(svg, point, stops, scales, &quot;方言点&quot;);
          stops.forEach((stop) =&gt; {
            drawStopNodes(svg, stop, scales, 7);
          });
          drawSlotLabels(svg, stops, scales);
        }, 0.48, 280, 430);
      }

      DATA.points.forEach((point, index) =&gt; {
        const option = document.createElement(&quot;option&quot;);
        option.value = point.id;
        option.textContent = `${point.id} ${point.name}｜${collapsedChain(point)}`;
        if (index === 0) option.selected = true;
        pointSelect.appendChild(option);
      });
      pointSelect.addEventListener(&quot;change&quot;, () =&gt; {
        renderClusters();
        renderPoint();
      });
      renderClusters();
      renderAlternativeSolutions();
      renderPoint();
    })();
  &lt;/script&gt;
&lt;/div&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
&lt;script id=&quot;codex-visualization-lucide&quot; async src=&quot;https://unpkg.com/lucide@1.17.0/dist/umd/lucide.js&quot;&gt;&lt;/script&gt;

(() =&gt; {
  const initialize = () =&gt; {
    globalThis.lucide?.createIcons({ attrs: { width: 16, height: 16 } });
  };
  if (globalThis.lucide != null) {
    initialize();
    return;
  }
  document
    .getElementById(&quot;codex-visualization-lucide&quot;)
    ?.addEventListener(&quot;load&quot;, initialize, { once: true });
})();
&lt;/script&gt;
